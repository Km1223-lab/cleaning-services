server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index km-cleaning-services.html;

    # Always-fresh for dev previews
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /km-cleaning-services.html;
    }
}
