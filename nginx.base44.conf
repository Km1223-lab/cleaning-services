server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index km-cleaning-services.html;

    # Always-fresh for dev previews
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    # Proxy chat & booking API to the local Node server (same-origin, no CORS issues)
    location /chat {
        proxy_pass http://chat:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /bookings {
        proxy_pass http://chat:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /km-cleaning-services.html;
    }
}
