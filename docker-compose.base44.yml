# Base44 dev environment for KM Cleaning Services (static site)
# Serves the cloned source via nginx on host port 3000.
# A local Node server (chat-server.js) replicates the Cloudflare Worker so the
# chatbot and bookings work in preview. In production, deploy km-chat-worker.js
# to Cloudflare and set WORKER_URL in km-cleaning-services.html.
services:
  web:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/km-cleaning-services.html"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chat:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "chat-server.js"]
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/bookings', r => process.exit(r.statusCode === 401 ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
